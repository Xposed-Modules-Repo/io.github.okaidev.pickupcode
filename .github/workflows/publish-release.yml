name: Publish release

# 为什么需要这个工作流：
# LSPosed 模块商店读的是「Release」，而不是 tag。维护者本地的 fine-grained
# token 对 Xposed-Modules-Repo 这个组织仓库没有写权限（组织未批准该 token），
# 但仓库自己的 GITHUB_TOKEN 有。所以把「发版」这件事交给仓库自己：
# 推一个形如 `403-4.0.3` 的 tag，这里自动把说明和 APK 从主仓库取过来发出去。
#
# tag 格式：<versionCode>-<versionName>，由 LSPosed 仓库规范要求。

on:
  push:
    tags:
      - '[0-9]*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag 名称（如 403-4.0.3）'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 解析版本
        id: v
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          case "$TAG" in
            [0-9]*-*) ;;
            *) echo "tag 格式不对，应为 <versionCode>-<versionName>：$TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#*-}" >> "$GITHUB_OUTPUT"

      - name: 从主仓库取说明与 APK
        env:
          VER: ${{ steps.v.outputs.ver }}
        run: |
          set -e
          MAIN="O-kai/Xiaomi-HyperOs-pickup-code-grabber"
          curl -fsSL -o notes.md \
            "https://raw.githubusercontent.com/$MAIN/main/docs/release-notes-$VER.md" \
            || { echo "没找到 release-notes-$VER.md，用一句话代替"; \
                 echo "版本 $VER" > notes.md; }
          curl -fsSL -o "pickup-code-grabber-v$VER.apk" \
            "https://github.com/$MAIN/releases/download/v$VER/pickup-code-grabber-$VER-release.apk"
          ls -l

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          set -e
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG 的 Release 已存在，跳过"
            exit 0
          fi
          # 保留 SHA-256，商店页和下载页都能核对
          sha256sum "pickup-code-grabber-v$VER.apk" | cut -d' ' -f1 > sha256.txt
          {
            echo ""
            echo "---"
            echo ""
            echo "SHA-256：\`$(cat sha256.txt)\`"
          } >> notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VER" \
            --notes-file notes.md \
            "pickup-code-grabber-v$VER.apk"
